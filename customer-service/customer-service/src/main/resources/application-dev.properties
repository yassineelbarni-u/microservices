# --- Profile: dev (local testing without Consul or config-service) -------------
spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.consul.discovery.register=false

# --- Database (PostgreSQL via Docker) ------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/customerdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=customer_user
spring.datasource.password=customer_pass
