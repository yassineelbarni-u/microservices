# ─── Application ───────────────────────────────────────────────────────────────
spring.application.name=customer-service
server.port=8081

# ─── Spring Cloud Config (optional — skipped if config-service is not running) ──
spring.config.import=optional:configserver:http://localhost:8888

# ─── Consul Service Discovery ───────────────────────────────────────────────────
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.prefer-ip-address=true
# Set to false to prevent crash when Consul is not running
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.enabled=true

# ─── Database (H2 — for development) ───────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Actuator (health, info, metrics) ──────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.example.customer_service=DEBUG
logging.level.org.springframework.web=INFO
