# --- Application --------------------------------------------------------------
spring.application.name=customer-service
server.port=8081

# --- Spring Cloud Config (optional) -------------------------------------------
spring.config.import=optional:configserver:http://localhost:8888

# --- Consul Service Discovery -------------------------------------------------
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.service-name=
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.enabled=true

# --- Database (PostgreSQL) ----------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/customerdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=customer_user
spring.datasource.password=customer_pass

# --- JPA / Hibernate ----------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator -----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Logging ------------------------------------------------------------------
logging.level.com.example.customer_service=DEBUG
logging.level.org.springframework.web=INFO
